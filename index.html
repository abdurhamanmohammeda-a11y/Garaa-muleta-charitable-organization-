
<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gara Muleta Charitable Organization</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #2e7d32; --gold: #FFD700; --dark: #1b1b1b; --white: #ffffff; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: #f0f2f5; color: #333; }
        
        header { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1488521787991-ed7bbaae773c?auto=format&fit=crop&w=1000&q=80'); 
                 background-size: cover; background-position: center; color: white; text-align: center; padding: 100px 20px; border-bottom: 5px solid var(--gold); }
        header h1 { font-size: clamp(30px, 8vw, 50px); color: var(--gold); margin: 0; text-transform: uppercase; }

        .container { max-width: 900px; margin: -40px auto 40px; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 25px; border-top: 4px solid var(--main); }
        
        h2 { color: var(--main); border-bottom: 2px solid var(--gold); padding-bottom: 5px; }
        .bank-box { background: #e8f5e9; padding: 20px; border-radius: 10px; border-left: 6px solid var(--main); font-weight: bold; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { background: #000; border-radius: 12px; overflow: hidden; height: 250px; position: relative; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-item p { position: absolute; bottom: 0; background: rgba(0,0,0,0.7); color: white; width: 100%; padding: 10px; margin: 0; font-size: 13px; }

        .item-row { border-bottom: 1px solid #eee; padding: 15px 0; }
        #adminArea { display: none; background: #fffde7; border: 2px dashed var(--gold); }
        input, textarea, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
        button { background: var(--main); color: white; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>GARA MULETA</h1>
    <p>"Namoonni Rabiin waa Harka Isiin Kaahe Nu Gargaraa"</p>
</header>

<div class="container">
    <div class="card">
        <h2>💰 Gargaarsa Galchuf</h2>
        <div class="bank-box">CBE Account: 1000680333207</div>
    </div>

    <div class="card">
        <h2>📢 Odeeffannoo Haaraa</h2>
        <div id="newsFeed">Fe'amaa jira...</div>
    </div>

    <div class="card">
        <h2>🖼️ Galmee Hojii (Gallery)</h2>
        <div class="gallery-grid" id="mediaGallery"></div>
    </div>

    <button onclick="showAdmin()" style="background: #333; font-size: 10px; opacity: 0.5;">ADMIN LOGIN</button>

    <div id="adminArea" class="card">
        <h2>✍️ Admin Panel (URL Fayyadami)</h2>
        <select id="pType">
            <option value="news">Odeeffannoo (News)</option>
            <option value="media">Suuraa/Viidiyoo (Gallery)</option>
        </select>
        <input type="text" id="pTitle" placeholder="Mataduree ykn Linkii Suuraa">
        <textarea id="pDesc" placeholder="Ibsa gabaabaa..."></textarea>
        <button onclick="publish()">PUBLISH NOW</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC-Owlqf-GVkm296DXT2ccR212x72r9Vg4",
  authDomain: "garaa-mulataa.firebaseapp.com",
  projectId: "garaa-mulataa",
  storageBucket: "garaa-mulataa.firebasestorage.app",
  messagingSenderId: "758391808027",
  appId: "1:758391808027:web:cff23c730cdba3ae7dd8be"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Fetch News
db.collection("news").orderBy("time", "desc").onSnapshot(s => {
    let html = ""; s.forEach(d => { html += `<div class="item-row"><h3>${d.data().title}</h3><p>${d.data().desc}</p></div>`; });
    document.getElementById("newsFeed").innerHTML = html || "Odeeffannoon hin jiru.";
});

// Fetch Gallery
db.collection("media").orderBy("time", "desc").onSnapshot(s => {
    let html = "";
    s.forEach(d => {
        const data = d.data();
        html += `<div class="gallery-item"><img src="${data.url}"><p>${data.desc}</p></div>`;
    });
    document.getElementById("mediaGallery").innerHTML = html;
});

function showAdmin() { if(prompt("Password:") === "1234") document.getElementById("adminArea").style.display = "block"; }

function publish() {
    const t = document.getElementById("pType").value;
    const title = document.getElementById("pTitle").value;
    const desc = document.getElementById("pDesc").value;
    
    if(!title || !desc) return alert("Bakka duwwaa guuti!");
    
    const col = (t === "news") ? "news" : "media";
    const payload = (t === "news") ? { title, desc } : { url: title, desc };
    payload.time = firebase.firestore.FieldValue.serverTimestamp();
    
    db.collection(col).add(payload).then(() => { 
        alert("Galmee keessan ol-ba'eera! ✅");
        location.reload(); 
    }).catch(e => alert("Error: " + e.message));
}
</script>
</body>
</html>
